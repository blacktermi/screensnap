appId: com.tribal.screensnap
productName: ScreenSnap
copyright: Copyright 2026 Tribal Enterprises

directories:
  output: out
  buildResources: assets

files:
  - dist/**/*
  - assets/**/*
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!src/**"
  - "!tests/**"
  - "!docs/**"

asar: true

mac:
  category: public.app-category.developer-tools
  icon: assets/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  sign: false
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
  window:
    width: 540
    height: 380

# Notarization — uncomment and configure for production releases
# afterSign: scripts/notarize.js
# mac:
#   notarize:
#     teamId: YOUR_TEAM_ID

extraResources:
  - from: assets/
    to: assets/
    filter:
      - "**/*"

electronDownload:
  cache: .cache/electron

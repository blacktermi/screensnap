<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Main diagonal gradient -->
    <linearGradient id="sunset-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#db2777"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <!-- Warm radial glow bottom-right (amber) -->
    <radialGradient id="sunset-glow-amber" cx="90%" cy="85%" r="55%" fx="90%" fy="85%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </radialGradient>
    <!-- Violet radial glow top-left -->
    <radialGradient id="sunset-glow-violet" cx="8%" cy="10%" r="50%" fx="8%" fy="10%">
      <stop offset="0%" stop-color="#6d28d9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#6d28d9" stop-opacity="0"/>
    </radialGradient>
    <!-- Pink center highlight -->
    <radialGradient id="sunset-center" cx="50%" cy="50%" r="40%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0"/>
    </radialGradient>
    <!-- Extra warmth bottom-left -->
    <radialGradient id="sunset-warmth" cx="20%" cy="90%" r="45%" fx="20%" fy="90%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- Base gradient -->
  <rect width="1920" height="1080" fill="url(#sunset-base)"/>
  <!-- Layered radial glows -->
  <rect width="1920" height="1080" fill="url(#sunset-glow-violet)"/>
  <rect width="1920" height="1080" fill="url(#sunset-glow-amber)"/>
  <rect width="1920" height="1080" fill="url(#sunset-center)"/>
  <rect width="1920" height="1080" fill="url(#sunset-warmth)"/>
</svg>
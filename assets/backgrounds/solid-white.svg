<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <!-- Noise texture filter -->
    <filter id="noise" x="0%" y="0%" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grayNoise"/>
      <feComponentTransfer in="grayNoise" result="fadedNoise">
        <feFuncA type="linear" slope="0.03"/>
      </feComponentTransfer>
      <feBlend in="SourceGraphic" in2="fadedNoise" mode="multiply"/>
    </filter>
    <!-- Very subtle warm radial gradient for depth -->
    <radialGradient id="white-warmth" cx="50%" cy="50%" r="60%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </radialGradient>
  </defs>
  <!-- White base with subtle warmth -->
  <rect width="1920" height="1080" fill="url(#white-warmth)" filter="url(#noise)"/>
  <!-- Thin border inset -->
  <rect x="0.5" y="0.5" width="1919" height="1079" fill="none" stroke="#e2e8f0" stroke-width="1"/>
</svg>
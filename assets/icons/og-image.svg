<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Brand gradient background -->
    <linearGradient id="og-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>

    <!-- Subtle radial glow -->
    <radialGradient id="og-glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.1)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Crosshair glow filter -->
    <filter id="og-crosshair-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Text shadow -->
    <filter id="text-shadow" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="rgba(0,0,0,0.3)"/>
    </filter>

    <!-- Icon shadow -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="rgba(0,0,0,0.35)"/>
    </filter>
  </defs>

  <style>
    .brand-bold {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-regular {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-weight: 300;
      letter-spacing: 0.02em;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#og-bg)"/>
  <rect width="1200" height="630" fill="url(#og-glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.04">
    <line x1="0" y1="0" x2="0" y2="630" stroke="white" stroke-width="1"/>
    <line x1="60" y1="0" x2="60" y2="630" stroke="white" stroke-width="1"/>
    <line x1="120" y1="0" x2="120" y2="630" stroke="white" stroke-width="1"/>
    <line x1="180" y1="0" x2="180" y2="630" stroke="white" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="630" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="630" stroke="white" stroke-width="1"/>
    <line x1="360" y1="0" x2="360" y2="630" stroke="white" stroke-width="1"/>
    <line x1="420" y1="0" x2="420" y2="630" stroke="white" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="630" stroke="white" stroke-width="1"/>
    <line x1="540" y1="0" x2="540" y2="630" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="630" stroke="white" stroke-width="1"/>
    <line x1="660" y1="0" x2="660" y2="630" stroke="white" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="630" stroke="white" stroke-width="1"/>
    <line x1="780" y1="0" x2="780" y2="630" stroke="white" stroke-width="1"/>
    <line x1="840" y1="0" x2="840" y2="630" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="630" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1020" y1="0" x2="1020" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1080" y1="0" x2="1080" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1140" y1="0" x2="1140" y2="630" stroke="white" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="630" stroke="white" stroke-width="1"/>
    <line x1="0" y1="0" x2="1200" y2="0" stroke="white" stroke-width="1"/>
    <line x1="0" y1="60" x2="1200" y2="60" stroke="white" stroke-width="1"/>
    <line x1="0" y1="120" x2="1200" y2="120" stroke="white" stroke-width="1"/>
    <line x1="0" y1="180" x2="1200" y2="180" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1200" y2="240" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="0" y1="360" x2="1200" y2="360" stroke="white" stroke-width="1"/>
    <line x1="0" y1="420" x2="1200" y2="420" stroke="white" stroke-width="1"/>
    <line x1="0" y1="480" x2="1200" y2="480" stroke="white" stroke-width="1"/>
    <line x1="0" y1="540" x2="1200" y2="540" stroke="white" stroke-width="1"/>
    <line x1="0" y1="600" x2="1200" y2="600" stroke="white" stroke-width="1"/>
    <line x1="0" y1="630" x2="1200" y2="630" stroke="white" stroke-width="1"/>
  </g>

  <!-- Centered icon (scaled version of the main icon) -->
  <g transform="translate(600, 220)" filter="url(#icon-shadow)">
    <g transform="translate(-120, -120)">
      <!-- Background squircle -->
      <rect x="4" y="4" width="232" height="232" rx="52" ry="52" fill="rgba(255,255,255,0.1)"/>
      <rect x="4" y="4" width="232" height="232" rx="52" ry="52" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

      <!-- Screen/Window frame -->
      <rect x="52" y="60" width="136" height="116" rx="5" ry="5"
            fill="none" stroke="white" stroke-width="8" opacity="0.95"/>

      <!-- Window title bar dots -->
      <circle cx="64" cy="70" r="3.5" fill="#ff5f57" opacity="0.9"/>
      <circle cx="74" cy="70" r="3.5" fill="#febc2e" opacity="0.9"/>
      <circle cx="84" cy="70" r="3.5" fill="#28c840" opacity="0.9"/>

      <!-- Title bar separator -->
      <line x1="56" y1="80" x2="184" y2="80" stroke="white" stroke-width="1" opacity="0.35"/>

      <!-- Viewfinder / Capture crosshair -->
      <g filter="url(#og-crosshair-glow)" opacity="0.95">
        <!-- Top-left corner -->
        <path d="M 83 95 L 83 90 Q 83 87 86 87 L 91 87"
              fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
        <!-- Top-right corner -->
        <path d="M 149 87 L 154 87 Q 157 87 157 90 L 157 95"
              fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
        <!-- Bottom-left corner -->
        <path d="M 83 148 L 83 153 Q 83 156 86 156 L 91 156"
              fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
        <!-- Bottom-right corner -->
        <path d="M 149 156 L 154 156 Q 157 156 157 153 L 157 148"
              fill="none" stroke="white" stroke-width="6" stroke-linecap="round"/>
      </g>

      <!-- Center crosshair dot -->
      <circle cx="120" cy="122" r="4" fill="white" opacity="0.9"/>

      <!-- Small crosshair lines -->
      <line x1="120" y1="113" x2="120" y2="117" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <line x1="120" y1="127" x2="120" y2="131" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <line x1="111" y1="122" x2="115" y2="122" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
      <line x1="125" y1="122" x2="129" y2="122" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>

      <!-- Flash/Snap indicator -->
      <g transform="translate(176, 36)" opacity="0.95">
        <path d="M 0 0 L -5 10 L 2 8 L -2 17"
              fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <!-- Lens flare accent -->
      <circle cx="176" cy="36" r="10" fill="white" opacity="0.08"/>
    </g>
  </g>

  <!-- "ScreenSnap" text centered below icon -->
  <text text-anchor="middle" x="600" y="400" filter="url(#text-shadow)">
    <tspan class="brand-bold" font-size="56" fill="white">Screen</tspan><tspan class="brand-regular" font-size="56" fill="rgba(255,255,255,0.85)">Snap</tspan>
  </text>

  <!-- Tagline -->
  <text text-anchor="middle" x="600" y="450" class="tagline" font-size="22" fill="rgba(255,255,255,0.6)">
    Open-source screen capture for macOS
  </text>

  <!-- Subtle bottom border accent -->
  <rect x="450" y="480" width="300" height="2" rx="1" fill="rgba(255,255,255,0.1)"/>
</svg>
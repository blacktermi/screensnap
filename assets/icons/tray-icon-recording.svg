<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 22 22" width="22" height="22">
  <!-- macOS menu bar tray icon - recording state -->

  <!-- Screen frame -->
  <rect x="2" y="3" width="18" height="14" rx="2" ry="2"
        fill="none" stroke="black" stroke-width="1.5"/>

  <!-- Title bar separator -->
  <line x1="3" y1="7" x2="19" y2="7" stroke="black" stroke-width="0.75" opacity="0.5"/>

  <!-- Recording indicator (red dot) -->
  <circle cx="11" cy="12" r="4" fill="#ff3b30"/>

  <!-- Recording pulse ring -->
  <circle cx="11" cy="12" r="6" fill="none" stroke="#ff3b30" stroke-width="1" opacity="0.4"/>
</svg>

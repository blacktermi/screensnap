<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect x="8" y="8" width="496" height="496" rx="110" ry="110" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="110" ry="110" fill="url(#glow)"/>

  <!-- Screen frame -->
  <rect x="120" y="130" width="272" height="232" rx="8" ry="8"
        fill="none" stroke="white" stroke-width="18" opacity="0.95"/>

  <!-- Title bar dots -->
  <circle cx="144" cy="152" r="7" fill="#ff5f57" opacity="0.9"/>
  <circle cx="164" cy="152" r="7" fill="#febc2e" opacity="0.9"/>
  <circle cx="184" cy="152" r="7" fill="#28c840" opacity="0.9"/>

  <!-- Title bar line -->
  <line x1="129" y1="168" x2="383" y2="168" stroke="white" stroke-width="1.5" opacity="0.35"/>

  <!-- Viewfinder corners -->
  <g opacity="0.95">
    <path d="M 190 205 L 190 195 Q 190 190 195 190 L 205 190"
          fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <path d="M 307 190 L 317 190 Q 322 190 322 195 L 322 205"
          fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <path d="M 190 305 L 190 315 Q 190 320 195 320 L 205 320"
          fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
    <path d="M 307 320 L 317 320 Q 322 320 322 315 L 322 305"
          fill="none" stroke="white" stroke-width="14" stroke-linecap="round"/>
  </g>

  <!-- Center dot -->
  <circle cx="256" cy="255" r="8" fill="white" opacity="0.9"/>

  <!-- Crosshair lines -->
  <line x1="256" y1="240" x2="256" y2="248" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="256" y1="262" x2="256" y2="270" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="241" y1="255" x2="249" y2="255" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  <line x1="263" y1="255" x2="271" y2="255" stroke="white" stroke-width="3" stroke-linecap="round" opacity="0.7"/>

  <!-- Flash indicator -->
  <g transform="translate(370, 84)" opacity="0.95">
    <path d="M 0 0 L -10 20 L 4 16 L -4 34"
          fill="none" stroke="#fbbf24" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>

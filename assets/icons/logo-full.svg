<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 80" width="420" height="80">
  <defs>
    <linearGradient id="icon-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>
    <radialGradient id="icon-glow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.12)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>
    <linearGradient id="txt-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="100%" style="stop-color:#2563eb"/>
    </linearGradient>
  </defs>

  <style>
    .brand-bold {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-regular {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', system-ui, sans-serif;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
  </style>

  <!-- Mini icon -->
  <g transform="translate(0, 4)">
    <!-- Background squircle -->
    <rect x="2" y="2" width="68" height="68" rx="16" ry="16" fill="url(#icon-bg)"/>
    <rect x="2" y="2" width="68" height="68" rx="16" ry="16" fill="url(#icon-glow)"/>

    <!-- Screen frame -->
    <rect x="16" y="19" width="40" height="34" rx="3" ry="3"
          fill="none" stroke="white" stroke-width="3" opacity="0.95"/>

    <!-- Title dots -->
    <circle cx="21" cy="23" r="1.5" fill="#ff5f57" opacity="0.9"/>
    <circle cx="26" cy="23" r="1.5" fill="#febc2e" opacity="0.9"/>
    <circle cx="31" cy="23" r="1.5" fill="#28c840" opacity="0.9"/>

    <!-- Separator -->
    <line x1="17.5" y1="28" x2="54.5" y2="28" stroke="white" stroke-width="0.5" opacity="0.35"/>

    <!-- Viewfinder -->
    <path d="M 27 33 L 27 31 Q 27 30 28 30 L 30 30"
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 42 30 L 44 30 Q 45 30 45 31 L 45 33"
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 27 45 L 27 47 Q 27 48 28 48 L 30 48"
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 42 48 L 44 48 Q 45 48 45 47 L 45 45"
          fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Center dot -->
    <circle cx="36" cy="39" r="2" fill="white" opacity="0.9"/>

    <!-- Flash -->
    <g transform="translate(52, 10)" opacity="0.95">
      <path d="M 0 0 L -2 4 L 1 3 L -1 7"
            fill="none" stroke="#fbbf24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="86" y="54" class="brand-bold" font-size="38" fill="url(#txt-grad)">Screen</text>
  <text x="252" y="54" class="brand-regular" font-size="38" fill="#3b82f6">Snap</text>
</svg>

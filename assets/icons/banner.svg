<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Brand gradient background -->
    <linearGradient id="banner-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#3b82f6"/>
    </linearGradient>

    <!-- Subtle radial glow -->
    <radialGradient id="banner-glow" cx="30%" cy="40%" r="70%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.08)"/>
      <stop offset="100%" style="stop-color:rgba(255,255,255,0)"/>
    </radialGradient>

    <!-- Crosshair glow filter -->
    <filter id="banner-crosshair-glow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Icon shadow -->
    <filter id="banner-icon-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="12" flood-color="rgba(0,0,0,0.3)"/>
    </filter>

    <!-- Feature icon glow -->
    <filter id="feature-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="rgba(0,0,0,0.2)"/>
    </filter>
  </defs>

  <style>
    .brand-bold {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .brand-regular {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-weight: 400;
      letter-spacing: -0.02em;
    }
    .tagline {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-weight: 300;
      letter-spacing: 0.05em;
    }
    .feature-label {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif;
      font-weight: 500;
      font-size: 13px;
      letter-spacing: 0.01em;
    }
  </style>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#banner-bg)"/>
  <rect width="1280" height="640" fill="url(#banner-glow)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="80" y1="0" x2="80" y2="640" stroke="white" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="640" stroke="white" stroke-width="1"/>
    <line x1="240" y1="0" x2="240" y2="640" stroke="white" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="640" stroke="white" stroke-width="1"/>
    <line x1="400" y1="0" x2="400" y2="640" stroke="white" stroke-width="1"/>
    <line x1="480" y1="0" x2="480" y2="640" stroke="white" stroke-width="1"/>
    <line x1="560" y1="0" x2="560" y2="640" stroke="white" stroke-width="1"/>
    <line x1="640" y1="0" x2="640" y2="640" stroke="white" stroke-width="1"/>
    <line x1="720" y1="0" x2="720" y2="640" stroke="white" stroke-width="1"/>
    <line x1="800" y1="0" x2="800" y2="640" stroke="white" stroke-width="1"/>
    <line x1="880" y1="0" x2="880" y2="640" stroke="white" stroke-width="1"/>
    <line x1="960" y1="0" x2="960" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1040" y1="0" x2="1040" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1120" y1="0" x2="1120" y2="640" stroke="white" stroke-width="1"/>
    <line x1="1200" y1="0" x2="1200" y2="640" stroke="white" stroke-width="1"/>
    <line x1="0" y1="80" x2="1280" y2="80" stroke="white" stroke-width="1"/>
    <line x1="0" y1="160" x2="1280" y2="160" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="1280" y2="240" stroke="white" stroke-width="1"/>
    <line x1="0" y1="320" x2="1280" y2="320" stroke="white" stroke-width="1"/>
    <line x1="0" y1="400" x2="1280" y2="400" stroke="white" stroke-width="1"/>
    <line x1="0" y1="480" x2="1280" y2="480" stroke="white" stroke-width="1"/>
    <line x1="0" y1="560" x2="1280" y2="560" stroke="white" stroke-width="1"/>
  </g>

  <!-- Logo icon on the left side -->
  <g transform="translate(280, 180)" filter="url(#banner-icon-shadow)">
    <g transform="translate(-100, -100)">
      <!-- Background squircle -->
      <rect x="4" y="4" width="192" height="192" rx="44" ry="44" fill="rgba(255,255,255,0.1)"/>
      <rect x="4" y="4" width="192" height="192" rx="44" ry="44" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2"/>

      <!-- Screen/Window frame -->
      <rect x="40" y="48" width="120" height="100" rx="4" ry="4"
            fill="none" stroke="white" stroke-width="7" opacity="0.95"/>

      <!-- Window title bar dots -->
      <circle cx="52" cy="58" r="3" fill="#ff5f57" opacity="0.9"/>
      <circle cx="62" cy="58" r="3" fill="#febc2e" opacity="0.9"/>
      <circle cx="72" cy="58" r="3" fill="#28c840" opacity="0.9"/>

      <!-- Title bar separator -->
      <line x1="44" y1="67" x2="156" y2="67" stroke="white" stroke-width="0.8" opacity="0.35"/>

      <!-- Viewfinder -->
      <g filter="url(#banner-crosshair-glow)" opacity="0.95">
        <path d="M 68 80 L 68 76 Q 68 73 71 73 L 75 73"
              fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
        <path d="M 125 73 L 129 73 Q 132 73 132 76 L 132 80"
              fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
        <path d="M 68 126 L 68 130 Q 68 133 71 133 L 75 133"
              fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
        <path d="M 125 133 L 129 133 Q 132 133 132 130 L 132 126"
              fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
      </g>

      <!-- Center crosshair -->
      <circle cx="100" cy="103" r="3.5" fill="white" opacity="0.9"/>
      <line x1="100" y1="95" x2="100" y2="99" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
      <line x1="100" y1="107" x2="100" y2="111" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
      <line x1="92" y1="103" x2="96" y2="103" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>
      <line x1="104" y1="103" x2="108" y2="103" stroke="white" stroke-width="1.4" stroke-linecap="round" opacity="0.7"/>

      <!-- Flash/Snap -->
      <g transform="translate(148, 28)" opacity="0.95">
        <path d="M 0 0 L -4 9 L 2 7 L -2 15"
              fill="none" stroke="#fbbf24" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <circle cx="148" cy="28" r="8" fill="white" opacity="0.08"/>
    </g>
  </g>

  <!-- Wordmark to the right of icon -->
  <text x="430" y="200">
    <tspan class="brand-bold" font-size="72" fill="white">Screen</tspan><tspan class="brand-regular" font-size="72" fill="rgba(255,255,255,0.85)">Snap</tspan>
  </text>

  <!-- Tagline below wordmark -->
  <text x="432" y="250" class="tagline" font-size="24" fill="rgba(255,255,255,0.55)" letter-spacing="0.15em">
    Capture. Annotate. Share.
  </text>

  <!-- Divider line -->
  <line x1="430" y1="290" x2="900" y2="290" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>

  <!-- Feature icons at the bottom -->
  <!-- Screenshot icon -->
  <g transform="translate(380, 370)" filter="url(#feature-glow)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Camera/screenshot simplified icon -->
    <rect x="-14" y="-8" width="28" height="20" rx="3" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="2" r="6" fill="none" stroke="white" stroke-width="1.5" opacity="0.8"/>
    <circle cx="0" cy="2" r="2" fill="white" opacity="0.6"/>
    <rect x="-8" y="-11" width="6" height="4" rx="1" fill="none" stroke="white" stroke-width="1.2" opacity="0.6"/>
    <text text-anchor="middle" x="0" y="52" class="feature-label" fill="rgba(255,255,255,0.5)">Screenshot</text>
  </g>

  <!-- Recording icon -->
  <g transform="translate(540, 370)" filter="url(#feature-glow)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Record button icon -->
    <circle cx="0" cy="0" r="12" fill="none" stroke="white" stroke-width="2" opacity="0.8"/>
    <circle cx="0" cy="0" r="6" fill="#ff5f57" opacity="0.85"/>
    <text text-anchor="middle" x="0" y="52" class="feature-label" fill="rgba(255,255,255,0.5)">Recording</text>
  </g>

  <!-- Annotation icon -->
  <g transform="translate(700, 370)" filter="url(#feature-glow)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Pen/annotation icon -->
    <path d="M -8 12 L -10 8 L 6 -8 L 10 -4 Z" fill="none" stroke="white" stroke-width="1.8" stroke-linejoin="round" opacity="0.8"/>
    <line x1="4" y1="-6" x2="8" y2="-2" stroke="white" stroke-width="1.5" opacity="0.6"/>
    <line x1="-10" y1="8" x2="-12" y2="14" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <text text-anchor="middle" x="0" y="52" class="feature-label" fill="rgba(255,255,255,0.5)">Annotation</text>
  </g>

  <!-- OCR icon -->
  <g transform="translate(860, 370)" filter="url(#feature-glow)">
    <rect x="-28" y="-28" width="56" height="56" rx="14" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Text recognition / OCR icon -->
    <text text-anchor="middle" x="0" y="-2" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', system-ui, sans-serif" font-weight="700" font-size="16" fill="white" opacity="0.8">T</text>
    <!-- Scan lines -->
    <line x1="-10" y1="8" x2="10" y2="8" stroke="white" stroke-width="1.2" opacity="0.4" stroke-dasharray="3,2"/>
    <line x1="-8" y1="12" x2="8" y2="12" stroke="white" stroke-width="1.2" opacity="0.3" stroke-dasharray="3,2"/>
    <!-- Viewfinder corners (tiny) -->
    <path d="M -14 -10 L -14 -14 L -10 -14" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <path d="M 10 -14 L 14 -14 L 14 -10" fill="none" stroke="white" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
    <text text-anchor="middle" x="0" y="52" class="feature-label" fill="rgba(255,255,255,0.5)">OCR</text>
  </g>
</svg>